<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Mohamed Amine Saad — Computer Engineering Student</title>
  <meta name="description" content="Portfolio of Mohamed Amine Saad, final-year Computer Engineering student at ENIS (Tunisia): AI, cybersecurity, blockchain and distributed systems projects.">
  <meta name="theme-color" content="#090a0f">
  <!-- Theme before first paint (no flash): saved choice, else the OS preference. -->
  <script>
    (function () {
      var theme = 'dark';
      try {
        var saved = localStorage.getItem('theme');
        theme = saved === 'light' || saved === 'dark'
          ? saved
          : (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      } catch (e) {}
      document.documentElement.setAttribute('data-theme', theme);
      if (theme === 'light') {
        document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f7f9fc');
      }
    })();
  </script>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
