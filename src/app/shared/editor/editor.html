<article class="profile card">

  <header class="card-head">
    <h3 class="fs-title">Profile</h3>
    <p class="fs-subtitle">The essentials, from my CV</p>
  </header>

  <dl class="fields">
    @for (field of fields; track field.label) {
      <div class="field" [class.wide]="field.wide">
        <dt>{{ field.label }}</dt>
        <dd>{{ field.value }}</dd>
      </div>
    }
  </dl>

</article>
