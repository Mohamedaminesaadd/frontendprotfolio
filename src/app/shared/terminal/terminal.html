<article class="profile-card card">

  <!-- Progress-style intro, as in the reference -->
  <p class="profile-eyebrow">
    <span class="step active">1</span>
    AI &amp; Security Engineering
  </p>

  <h1 class="profile-name">Mohamed Amine Saad</h1>

  <p class="profile-role">
    Final-year Computer Engineering student at
    <strong>ENIS</strong>, Sfax, Tunisia.
  </p>

  <!-- Terminal block (original identity) -->
  <div class="terminal" aria-label="Profile summary">
    <div class="code-line">
      <span class="prompt">$</span>
      <span class="command">echo $FOCUS</span>
    </div>
    <div class="code-line output" [attr.aria-label]="focusText">
      <span aria-hidden="true">{{ focus() }}<span class="typing-cursor"></span></span>
    </div>

    <div class="code-line">
      <span class="prompt">$</span>
      <span class="command">cat status.txt</span>
    </div>
    <div class="code-line output">
      <span><mark class="status-text">Looking for an end-of-studies (PFE) internship in AI cybersecurity ...</mark></span>
    </div>
  </div>

  <div class="profile-actions">
    <a
      class="btn btn-primary"
      href="files/Mohamed-Amine-Saad-CV.pdf"
      download="Mohamed-Amine-Saad-CV.pdf"
      type="application/pdf"
      aria-label="Download CV (PDF)"
    >
      <iconify-icon icon="mdi:download" aria-hidden="true"></iconify-icon>
      Download CV
    </a>
    <a class="btn btn-secondary" routerLink="/projects">View projects</a>
    <a class="btn btn-secondary" routerLink="/contact">Contact me</a>
  </div>

  <div class="profile-links">
    <a href="https://github.com/Mohamedaminesaadd" target="_blank" rel="noopener noreferrer" aria-label="GitHub profile">
      <iconify-icon icon="mdi:github" aria-hidden="true"></iconify-icon> GitHub
    </a>
    <a href="https://www.linkedin.com/in/mohamed-amine-50956b296/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn profile">
      <iconify-icon icon="mdi:linkedin" aria-hidden="true"></iconify-icon> LinkedIn
    </a>
  </div>

</article>
