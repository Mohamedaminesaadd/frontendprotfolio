<article [class]="'skill-category card tone-' + tone">

  <header class="category-header">
    <span class="folder-icon" aria-hidden="true">
      <iconify-icon [attr.icon]="categoryIcon"></iconify-icon>
    </span>
    <h3 class="fs-title category-name">{{ categoryName }}</h3>
  </header>

  <ul class="skill-items">
    @for (skill of skills; track skill.name) {
      <li class="skill-item">
        <iconify-icon class="skill-icon" [attr.icon]="skill.icon" aria-hidden="true"></iconify-icon>
        <span class="skill-name">{{ skill.name }}</span>
      </li>
    }
  </ul>

  @if (usedIn.length) {
    <p class="used-in">
      <span class="used-in-label">Used in</span>
      {{ usedIn.join(' · ') }}
    </p>
  }

</article>
