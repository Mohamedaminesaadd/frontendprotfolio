<article class="certs card" id="certifications">

  <header class="card-head">
    <h3 class="fs-title">Verified certificates</h3>
    <p class="fs-subtitle">Each one opens its official verification page</p>
  </header>

  <ol class="cert-list">
    @for (cert of certificates; track cert.verifyUrl; let i = $index) {
      <li>
        <a
          class="cert"
          [href]="cert.verifyUrl"
          target="_blank"
          rel="noopener noreferrer"
          [attr.aria-label]="cert.title + (cert.issuer ? ', ' + cert.issuer : '') + ' — open the verification page'"
        >
          <span class="step active">{{ i + 1 }}</span>

          <span class="cert-meta">
            <span class="cert-title">{{ cert.title }}</span>
            <span class="cert-issuer">
              @if (cert.issuer) {
                {{ cert.issuer }} ·
              }
              {{ cert.platform }}
            </span>
          </span>

          <span class="btn btn-secondary btn-sm cert-verify" aria-hidden="true">Verify ↗</span>
        </a>
      </li>
    }
  </ol>

</article>
